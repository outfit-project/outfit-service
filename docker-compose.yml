services:
  outfit-service:
    build: .
    container_name: outfit_api
    env_file:
      - .env
      - ../deploy.env
    environment:
      ITEMS_URL: http://outfit_wardrobe_api:8000/items/
      REDIS_URL: redis://outfit_redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://192.168.0.213,http://localhost:5173,http://localhost:3000}
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - outfit-network
      - wardrobe-shared
    restart: on-failure

  redis:
    image: redis:7-alpine
    container_name: outfit_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "26379:6379"
    volumes:
      - redisdata_outfit:/data
    networks:
      - outfit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redisdata_outfit:

networks:
  outfit-network:
    driver: bridge
  wardrobe-shared:
    external: true
    name: ${WARDROBE_DOCKER_NETWORK:-wardrobe-service_wardrobe-network}
